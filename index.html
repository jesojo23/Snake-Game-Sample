<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Snake</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
    background: #14213d;
    color: #f1f1f1;
    font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
  }
  h1 { margin: 0; font-size: 2rem; letter-spacing: 2px; }
  #hud { display: flex; gap: 24px; font-size: 1.1rem; }
  canvas {
    background: #0b132b;
    border: 3px solid #fca311;
    border-radius: 8px;
    max-width: 92vw;
    height: auto;
  }
  #message { min-height: 1.4em; color: #fca311; font-weight: 600; }
  button {
    background: #fca311;
    color: #14213d;
    border: none;
    border-radius: 6px;
    padding: 10px 18px;
    font-size: 1rem;
    font-weight: 700;
    cursor: pointer;
  }
  button:hover { filter: brightness(1.1); }
  #pad {
    display: grid;
    grid-template-columns: repeat(3, 56px);
    grid-template-rows: repeat(2, 56px);
    gap: 6px;
  }
  #pad button { padding: 0; font-size: 1.4rem; }
  #up { grid-column: 2; }
  #left { grid-column: 1; grid-row: 2; }
  #down { grid-column: 2; grid-row: 2; }
  #right { grid-column: 3; grid-row: 2; }
  .hint { font-size: 0.9rem; opacity: 0.7; }
</style>
</head>
<body>
  <h1>🐍 SNAKE</h1>
  <div id="hud">
    <div>Score: <span id="score">0</span></div>
    <div>Best: <span id="best">0</span></div>
  </div>

  <canvas id="game" width="400" height="400"></canvas>
  <div id="message">Press any arrow key or Start to play</div>
  <button id="start">Start</button>

  <div id="pad">
    <button id="up">▲</button>
    <button id="left">◀</button>
    <button id="down">▼</button>
    <button id="right">▶</button>
  </div>
  <div class="hint">Arrow keys / WASD to move · Space to pause</div>

<script>
  const canvas = document.getElementById("game");
  const ctx = canvas.getContext("2d");
  const scoreEl = document.getElementById("score");
  const bestEl = document.getElementById("best");
  const messageEl = document.getElementById("message");

  const TILE = 20;                       // size of one square in pixels
  const COUNT = canvas.width / TILE;     // squares per row (20)

  let snake, dir, nextDir, food, score, timer, running, paused;
  let best = 0;
  try { best = Number(localStorage.getItem("snakeBest")) || 0; } catch (e) {}
  bestEl.textContent = best;

  function reset() {
    snake = [{ x: 10, y: 10 }, { x: 9, y: 10 }, { x: 8, y: 10 }];
    dir = { x: 1, y: 0 };
    nextDir = dir;
    score = 0;
    scoreEl.textContent = score;
    placeFood();
    paused = false;
  }

  function placeFood() {
    do {
      food = {
        x: Math.floor(Math.random() * COUNT),
        y: Math.floor(Math.random() * COUNT)
      };
    } while (snake.some(s => s.x === food.x && s.y === food.y));
  }

  function start() {
    reset();
    running = true;
    messageEl.textContent = "";
    clearInterval(timer);
    timer = setInterval(step, 120);
  }

  function gameOver() {
    running = false;
    clearInterval(timer);
    if (score > best) {
      best = score;
      bestEl.textContent = best;
      try { localStorage.setItem("snakeBest", best); } catch (e) {}
      messageEl.textContent = "New best score! Press Start to play again";
    } else {
      messageEl.textContent = "Game over! Press Start to play again";
    }
  }

  function step() {
    if (paused) return;
    dir = nextDir;
    const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };

    // hit a wall or yourself?
    const hitWall = head.x < 0 || head.y < 0 || head.x >= COUNT || head.y >= COUNT;
    const hitSelf = snake.some(s => s.x === head.x && s.y === head.y);
    if (hitWall || hitSelf) return gameOver();

    snake.unshift(head);

    if (head.x === food.x && head.y === food.y) {
      score++;
      scoreEl.textContent = score;
      placeFood();
    } else {
      snake.pop(); // didn't eat: move without growing
    }
    draw();
  }

  function draw() {
    ctx.fillStyle = "#0b132b";
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // food
    ctx.fillStyle = "#e63946";
    ctx.beginPath();
    ctx.arc(food.x * TILE + TILE / 2, food.y * TILE + TILE / 2, TILE / 2 - 2, 0, Math.PI * 2);
    ctx.fill();

    // snake
    snake.forEach((s, i) => {
      ctx.fillStyle = i === 0 ? "#fca311" : "#2ec4b6";
      ctx.fillRect(s.x * TILE + 1, s.y * TILE + 1, TILE - 2, TILE - 2);
    });
  }

  function turn(x, y) {
    if (!running) start();
    // don't allow reversing straight into yourself
    if (x === -dir.x && y === -dir.y) return;
    nextDir = { x, y };
  }

  document.addEventListener("keydown", e => {
    const k = e.key.toLowerCase();
    if (k === "arrowup" || k === "w") { e.preventDefault(); turn(0, -1); }
    else if (k === "arrowdown" || k === "s") { e.preventDefault(); turn(0, 1); }
    else if (k === "arrowleft" || k === "a") { e.preventDefault(); turn(-1, 0); }
    else if (k === "arrowright" || k === "d") { e.preventDefault(); turn(1, 0); }
    else if (k === " " && running) {
      e.preventDefault();
      paused = !paused;
      messageEl.textContent = paused ? "Paused" : "";
    }
  });

  document.getElementById("start").onclick = start;
  document.getElementById("up").onclick = () => turn(0, -1);
  document.getElementById("down").onclick = () => turn(0, 1);
  document.getElementById("left").onclick = () => turn(-1, 0);
  document.getElementById("right").onclick = () => turn(1, 0);

  reset();
  draw();
</script>
</body>
</html>
